# Appli Android de TEST : fabriquée chez GitHub à chaque changement du
# dossier android/. Le fichier .apk à installer se trouve dans les
# « Artifacts » du passage (vigie-nc-test). Rien à installer sur un ordinateur.
name: Appli Android (test)

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    name: Fabrication de l'APK de test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Fabrication
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Nom du fichier
        run: cp app/build/outputs/apk/debug/app-debug.apk vigie-nc-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vigie-nc-test
          path: android/vigie-nc-test.apk
          retention-days: 30
