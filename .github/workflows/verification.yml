# Vérification automatique à chaque pull request (et sur main) :
#   1. l'appli se construit (types TypeScript + build Next.js) ;
#   2. supabase/schema.sql passe deux fois de suite sur un Postgres + PostGIS
#      (il doit rester ré-exécutable), puis supabase/tests/essais.sql ;
#   3. les tests de la logique de l'appli (vigie-nc/tests : mode conduite,
#      badges, fiabilité, chantiers, relais, erreurs), sans dépendance.
# Tout tourne chez GitHub : rien à installer, résultat visible sur la PR.
name: Vérification

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    name: Tests de la logique
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vigie-nc
    steps:
      - uses: actions/checkout@v7
      # Node 22 lit le TypeScript tout seul : pas besoin d'installer les dépendances.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Tests
        run: npm test

  appli:
    name: Build de l'appli
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: vigie-nc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Dépendances
        id: deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
            echo "genere=1" >> "$GITHUB_OUTPUT"
          fi
      # Sans package-lock.json dans le dépôt, celui qui vient d'être créé est
      # ajouté à la branche de la pull request (versions figées ensuite).
      - name: Ajouter le package-lock.json créé
        if: steps.deps.outputs.genere == '1' && github.event_name == 'pull_request'
        working-directory: .
        env:
          BRANCHE: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCHE"
          git checkout -B "$BRANCHE" "origin/$BRANCHE"
          git add vigie-nc/package-lock.json
          git commit -m "package-lock.json créé par la vérification (versions figées)"
          git push origin "HEAD:$BRANCHE"
      - name: Types TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: cle-de-test

  base:
    name: Schéma SQL et essais
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PGOPTIONS: -c search_path=public,extensions
    steps:
      - uses: actions/checkout@v7
      - name: Faux Supabase (rôles, auth, storage)
        run: psql -v ON_ERROR_STOP=1 -f vigie-nc/supabase/tests/shim-supabase.sql
      # En cas d'erreur, le message SQL est aussi affiché sur la pull
      # request (annotation), sans avoir à ouvrir le journal.
      - name: Schéma (1er passage)
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -1 -f vigie-nc/supabase/schema.sql 2>&1 | tee sortie.txt || {
            echo "::error title=Schéma SQL (1er passage)::$(grep -m3 -E 'ERROR|ERREUR' sortie.txt | tr '\n' ' ')"
            exit 1
          }
      - name: Schéma (2e passage, ré-exécutable)
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -1 -f vigie-nc/supabase/schema.sql 2>&1 | tee sortie.txt || {
            echo "::error title=Schéma SQL (2e passage)::$(grep -m3 -E 'ERROR|ERREUR' sortie.txt | tr '\n' ' ')"
            exit 1
          }
      - name: Essais
        shell: bash
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -1 -f vigie-nc/supabase/tests/essais.sql 2>&1 | tee sortie.txt || {
            echo "::error title=Essais SQL::$(grep -m3 -E 'ERROR|ERREUR' sortie.txt | tr '\n' ' ')"
            exit 1
          }
